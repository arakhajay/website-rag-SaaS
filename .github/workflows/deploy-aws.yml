name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: sitebot/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v3
        with:
          path: sitebot/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('sitebot/package-lock.json') }}-${{ hashFiles('sitebot/**/*.js', 'sitebot/**/*.jsx', 'sitebot/**/*.ts', 'sitebot/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('sitebot/package-lock.json') }}-

      - name: Install Dependencies
        working-directory: ./sitebot
        run: npm ci

      - name: Build Application
        working-directory: ./sitebot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Prepare Standalone Build
        working-directory: ./sitebot
        run: |
          # Create destination directories
          mkdir -p .next/standalone/.next
          mkdir -p .next/standalone/public

          # Copy static files (critical for Next.js)
          cp -r .next/static .next/standalone/.next/
          cp -r public/* .next/standalone/public/ || true
          
          # Copy Procfile to root of standalone
          cp Procfile .next/standalone/Procfile

          # Copy .platform config for nginx (proxy timeouts)
          cp -r .platform .next/standalone/.platform || true

      - name: Generate Deployment Package
        working-directory: ./sitebot/.next/standalone
        run: zip -r ../../../deploy.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ZivoxAgent
          environment_name: ZivoxAgent-env
          version_label: "ver-${{ github.sha }}"
          region: ap-south-1
          deployment_package: deploy.zip
