name: Deploy to VPS (Docker Compose)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "${APP_DIR}" ]; then
              APP_DIR="/root/website-rag-SaaS"
              echo "VPS_APP_DIR not set. Using default: $APP_DIR"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Repo not found at $APP_DIR. Cloning..."
              mkdir -p "$APP_DIR"
              # IMPORTANT: your VPS must have GitHub access (recommended: deploy key in ~/.ssh)
              git clone git@github.com:arakhajay/website-rag-SaaS.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main

            cd deploy
            if [ -f docker-compose.nodomain.yml ]; then
              echo "Using nodomain override (docker-compose.nodomain.yml)"
              docker compose -f docker-compose.yml -f docker-compose.nodomain.yml up -d --build
            else
              docker compose up -d --build
            fi
            docker image prune -f
