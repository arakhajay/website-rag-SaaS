name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: arakhajay/sitebot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./sitebot
          file: ./sitebot/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,SUPABASE_SERVICE_ROLE_KEY,OPENAI_API_KEY,PINECONE_API_KEY,PINECONE_INDEX,FIRECRAWL_API_KEY,DODO_PAYMENTS_API_KEY,DODO_PAYMENTS_WEBHOOK_SECRET,DODO_PAYMENTS_IS_LIVE,IMAGE_TAG
          script: |
            set -e
            echo "Starting deployment..."

            # Clone or pull latest code (for docker-compose.yml, Caddyfile, etc.)
            if [ ! -d "$HOME/website-rag-SaaS" ]; then
              echo "Cloning repository..."
              git clone https://github.com/arakhajay/website-rag-SaaS.git $HOME/website-rag-SaaS
            fi

            cd $HOME/website-rag-SaaS
            git fetch origin main
            git reset --hard origin/main

            echo "Current commit:"
            git log -1 --oneline

            echo "Writing .env file..."
            cat > $HOME/website-rag-SaaS/deploy/.env << EOF
            NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
            SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
            OPENAI_API_KEY=$OPENAI_API_KEY
            PINECONE_API_KEY=$PINECONE_API_KEY
            PINECONE_INDEX=$PINECONE_INDEX
            FIRECRAWL_API_KEY=$FIRECRAWL_API_KEY
            DODO_PAYMENTS_API_KEY=$DODO_PAYMENTS_API_KEY
            DODO_PAYMENTS_WEBHOOK_SECRET=$DODO_PAYMENTS_WEBHOOK_SECRET
            DODO_PAYMENTS_IS_LIVE=$DODO_PAYMENTS_IS_LIVE
            EOF

            echo "Logging into GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u arakhajay --password-stdin

            echo "Pulling latest image..."
            docker pull ghcr.io/arakhajay/sitebot:$IMAGE_TAG

            echo "Restarting containers..."
            cd $HOME/website-rag-SaaS/deploy
            docker compose down
            docker compose up -d

            echo "Cleaning up old images..."
            docker image prune -f || true

            echo "Deployment completed successfully!"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
          DODO_PAYMENTS_WEBHOOK_SECRET: ${{ secrets.DODO_PAYMENTS_WEBHOOK_SECRET }}
          DODO_PAYMENTS_IS_LIVE: ${{ secrets.DODO_PAYMENTS_IS_LIVE }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
