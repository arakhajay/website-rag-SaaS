name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Navigate to the project directory or clone it if it doesn't exist
            if [ ! -d "~/website-rag-SaaS" ]; then
              git clone https://github.com/arakhajay/website-rag-SaaS.git ~/website-rag-SaaS
            fi
            
            cd ~/website-rag-SaaS
            
            # Fetch the latest changes and reset hard to match main branch strictly
            git fetch origin main
            git reset --hard origin/main
            
            # Rebuild and restart the Docker containers
            docker compose down
            docker compose up -d --build
            
            # Clean up dangling images to save disk space
            docker image prune -f
