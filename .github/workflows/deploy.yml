name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,SUPABASE_SERVICE_ROLE_KEY,OPENAI_API_KEY,PINECONE_API_KEY,PINECONE_INDEX,FIRECRAWL_API_KEY,DODO_PAYMENTS_API_KEY,DODO_PAYMENTS_WEBHOOK_SECRET,DODO_PAYMENTS_IS_LIVE
          script: |
            set -e
            echo "Starting deployment..."
            
            # Clone or pull latest code
            if [ ! -d "$HOME/website-rag-SaaS" ]; then
              echo "Cloning repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git $HOME/website-rag-SaaS
            fi

            cd $HOME/website-rag-SaaS

            echo "Fetching latest main branch..."
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            
            echo "Current commit:"
            git log -1 --oneline

            echo "Writing .env file..."
            cat > $HOME/website-rag-SaaS/deploy/.env << EOF
            NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY=$NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_APP_URL=$NEXT_PUBLIC_APP_URL
            SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
            OPENAI_API_KEY=$OPENAI_API_KEY
            PINECONE_API_KEY=$PINECONE_API_KEY
            PINECONE_INDEX=$PINECONE_INDEX
            FIRECRAWL_API_KEY=$FIRECRAWL_API_KEY
            DODO_PAYMENTS_API_KEY=$DODO_PAYMENTS_API_KEY
            DODO_PAYMENTS_WEBHOOK_SECRET=$DODO_PAYMENTS_WEBHOOK_SECRET
            DODO_PAYMENTS_IS_LIVE=$DODO_PAYMENTS_IS_LIVE
            EOF

            echo "Rebuilding and restarting Docker containers..."
            cd $HOME/website-rag-SaaS/deploy

            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "Cleaning up dangling images..."
            # || true prevents prune failure from failing the whole script if there's nothing to prune
            docker image prune -f || true
            
            echo "Deployment completed successfully!"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DODO_PAYMENTS_API_KEY: ${{ secrets.DODO_PAYMENTS_API_KEY }}
          DODO_PAYMENTS_WEBHOOK_SECRET: ${{ secrets.DODO_PAYMENTS_WEBHOOK_SECRET }}
          DODO_PAYMENTS_IS_LIVE: ${{ secrets.DODO_PAYMENTS_IS_LIVE }}
